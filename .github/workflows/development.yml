name: Deploy to Amazon ECS

on:
  push:
    branches: [ "master-aws" ]

env:
  AWS_REGION: "ap-south-1"                   # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: "kesowa-server"          # set this to your Amazon ECR repository name
  ECS_SERVICE: "kesowa-server"                 # set this to your Amazon ECS service name
  ECS_CLUSTER: "kesowa-server"      # set this to your Amazon ECS cluster name
  ECS_TASK_DEFINITION: "./aws/task-definition.json" # set this to the path to your Amazon ECS task definition
                                               # file, e.g. .aws/task-definition.json
  CONTAINER_NAME: "kesowa-server"           # set this to the name of the container in the
                                               # containerDefinitions section of your task definition

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Set up environment variables
      run: |
        echo "PORT=${{ vars.PORT }}" >> .env
        echo "MONGODB_CONNECTION_STRING=${{ secrets.MONGODB_CONNECTION_STRING }}" >> .env
        echo "SMTP_PASSWORD=${{ vars.SMTP_PASSWORD }}" >> .env
        echo "SMTP_USERNAME=${{ vars.SMTP_USERNAME }}" >> .env
        echo "SMTP_SERVER=${{ vars.SMTP_SERVER }}" >> .env
        echo "SMTP_PORT=${{ vars.SMTP_PORT }}" >> .env
        echo "MAP_KEY=${{ vars.MAP_KEY }}" >> .env
        echo "BASE_SERVER=${{ vars.BASE_SERVER }}" >> .env
        echo "TITILER_STATIC=${{ vars.TITILER_STATIC }}" >> .env
        echo "FTP_PORT=${{ vars.FTP_PORT }}" >> .env
        echo "FTP_HOST_DEV=${{ vars.FTP_HOST_DEV }}" >> .env
        echo "FTP_HOST_PROD=${{ vars.FTP_HOST_PROD }}" >> .env
        echo "FTP_USERNAME=${{ vars.FTP_USERNAME }}" >> .env
        echo "FTP_PASSWORD=${{ vars.FTP_PASSWORD }}" >> .env
        echo "RESET_PASSWORD_TOKEN_EXPIRE=${{ vars.RESET_PASSWORD_TOKEN_EXPIRE }}" >> .env
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
        echo "ARU_INSTANCE=${{ vars.ARU_INSTANCE }}" >> .env
        echo "LIVE_URL=${{ vars.LIVE_URL }}" >> .env
        echo "RAZORPAY_KEY_ID=${{ vars.RAZORPAY_KEY_ID }}" >> .env
        echo "RAZORPAY_KEY_SECRET=${{ vars.RAZORPAY_KEY_SECRET }}" >> .env
        echo "RAZORPAY_HOOK_SECRET=${{ vars.RAZORPAY_HOOK_SECRET }}" >> .env
        echo "TITILER_SERVER=${{ vars.TITILER_SERVER }}" >> .env
        echo "MODE=${{ vars.MODE }}" >> .env
        echo "TITILER_PUBLIC=${{ vars.TITILER_PUBLIC }}" >> .env
        echo "RTMP_PUBLIC=${{ vars.RTMP_PUBLIC }}" >> .env
        echo "REDIS_URI=${{ vars.REDIS_URI }}" >> .env
        echo "API_SERVER=${{ vars.API_SERVER }}" >> .env
        echo "PUBLIC_SERVER=${{ vars.PUBLIC_SERVER }}" >> .env
        echo "CDN_URL=${{ vars.CDN_URL }}" >> .env
        echo "PUBLIC_DIR=${{ vars.PUBLIC_DIR }}" >> .env
        echo "SEQ_URL=${{ vars.SEQ_URL }}" >> .env
        echo "SEQ_KEY=${{ secrets.SEQ_KEY }}" >> .env
        echo "S3_KEY_ID=${{ secrets.S3_KEY_ID }}" >> .env
        echo "S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}" >> .env
        echo "ACCESS_KEY=${{ secrets.ACCESS_KEY }}" >> .env
        echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
        echo "AWS_S3_ENDPOINT=${{ vars.AWS_S3_ENDPOINT }}" >> .env
        echo "AWS_S3_BUCKET=${{ vars.AWS_S3_BUCKET }}" >> .env
        echo "AWS_MEDIACONVERT_ENDPOINT=${{ vars.AWS_MEDIACONVERT_ENDPOINT }}" >> .env
        echo "ENDPOINT=${{ vars.ENDPOINT }}" >> .env

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: "latest"
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY" >> $GITHUB_OUTPUT
        docker build -f ./Dockerfile --build-arg FILE_PATH=./.env -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT    
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true