services:
  server:
    build:
      context: .
      dockerfile: dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public:rw
    environment:
      - TZ="Asia/Kolkata"
      - MONGODB_CONNECTION_STRING=mongodb://mongodb:27017/test
      - RABBITMQ_CONNECTION_STRING=ampq://rabbitmq
    env_file:
      - ./server.env
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - 5011:5011
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 2g
    memswap_limit: 4g
    cpus: 1.5

  mongodb:
    image: mongo@sha256:06cd2e814b2641d4c7ac6b093e870fe72c1ddbc7c6ddaaef16d4cb5a61c0ee6b
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=test
    ports:
      - 27019:27017
    mem_limit: 256m
    memswap_limit: 512m

  titiler:
    environment:
      - PORT=8000
      - WORKERS_PER_CORE=1
      - MAX_WORKERS=1
    image: ghcr.io/developmentseed/titiler@sha256:45565498b88d5b77360014ab9dd217c17617ae59d308769f67c24e7540a78d02
    ports:
      - 8000:8000
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

  rabbitmq:
    image: rabbitmq@sha256:473953b02b8346091f0b3a6819e017618cbe95cb568bca2fecf00966a20ccf2a
    # mem_limit: 128m
    # memswap_limit: 128m
