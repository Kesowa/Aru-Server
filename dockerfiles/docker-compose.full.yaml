services:
  server:
    environment:
      - TITILER_SERVER=http://titiler:8000
      - TITILER_STATIC=http://server:5011
      - REDIS_URI=redis://redis:6379
    depends_on:
      - redis
      - titiler
    ports:
      - 5011:5011

  mongodb:
    ports:
      - 27017:27017

  redis:
    image: redis@sha256:aeed51f49a6331df0cb2c1039ae3d1d70d882be3f48bde75cd240452a2348e88
    ports:
      - 6379:6379

  titiler:
    environment:
      - PORT=8000
      - WORKERS_PER_CORE=1
    image: ghcr.io/developmentseed/titiler@sha256:45565498b88d5b77360014ab9dd217c17617ae59d308769f67c24e7540a78d02
    ports:
      - 8000:8000

  nginx:
    build:
      context: .
      dockerfile: dockerfile.nginx
    depends_on:
      - server
    ports:
      - 1935:1935
      - 8080:80
    volumes:
      - ./src/public/vod:/recordings:rw
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
