user root;
error_log /dev/stderr debug;

events {
    worker_connections 1024;
}

rtmp {
    server {
        max_streams 128;
        listen 1935;
        chunk_size 4096;

        application stream {
            live on;
			allow play 127.0.0.1;
			on_publish http://server:5011/apis/v1/streamtoken/validate-token;
            exec_push /opt/ffmpeg/ffmpeg -i rtmp://127.0.0.1:1935/stream/$name
              -c:a libfdk_aac -b:a 128k -c:v libx264 -b:v 2500k -f flv -g 30 -r 30 -s 1280x720 -vf "setpts=PTS-STARTPTS" -af "asetpts=PTS-STARTPTS" -vf "drawtext=fontfile=/usr/share/fonts/truetype/ttf-dejavu/DejaVuSans-Bold.ttf: text=%{localtime}: fontsize=20: fontcolor=white@0.8: x=10:y=10"  -preset superfast -profile:v baseline rtmp://127.0.0.1:1935/hls/$name_720p2628kbs              
              -c:a libfdk_aac -b:a 128k -c:v libx264 -b:v 1000k -f flv -g 30 -r 30 -s 854x480 -vf "setpts=PTS-STARTPTS" -af "asetpts=PTS-STARTPTS" -vf "drawtext=fontfile=/usr/share/fonts/truetype/ttf-dejavu/DejaVuSans-Bold.ttf: text=%{localtime}: fontsize=20: fontcolor=white@0.8: x=10:y=10" -preset superfast -profile:v baseline rtmp://127.0.0.1:1935/hls/$name_480p1128kbs
              -c:a libfdk_aac -b:a 128k -c:v libx264 -b:v 2500k -f flv -g 30 -r 30 -s 1280x720 -vf "setpts=PTS-STARTPTS" -af "asetpts=PTS-STARTPTS" -vf "drawtext=fontfile=/usr/share/fonts/truetype/ttf-dejavu/DejaVuSans-Bold.ttf: text=%{localtime}: fontsize=20: fontcolor=white@0.8: x=10:y=10" -preset superfast -profile:v baseline rtmp://127.0.0.1:1935/vod/$name;
            
           # on_publish_done http://172.16.3.32:5011/apis/v1/streamtoken/remove-token;
        }
        application vod {
            live on;
            record all;
             # record_interval 15s;net
            record_path /recordings;
            # # record_max_size 100000K;
            # # record_unique on;
            record_suffix -%d-%b-%y-%H-%M-%S.flv;
            exec_record_done /opt/ffmpeg/ffmpeg -i $path 
                -c:v libx264 -b:v 2500k -g 30 -r 30 -s 1280x720 -preset fast -profile:v baseline -hls_list_size 0 -f hls /recordings/$basename.m3u8
                # -c:v libx264 -b:v 2500k -g 30 -r 30 -s 1280x720 -vf "drawtext=fontfile=/usr/share/fonts/truetype/ttf-dejavu/DejaVuSans-Bold.ttf: text=%{localtime}: fontsize=20: fontcolor=white@0.8: x=10: y=h-th-10" -preset fast -profile:v baseline -f segment -strftime 1 -segment_list /network_drive/$name-$date_local.m3u8 -segment_time 10 /network_drive/$name-%d-%m-%Y-%H-%M-%S.ts
                -ss 00:00:05.000 -vframes 1 /recordings/$basename.jpg;
            exec_record_done curl -d '{"filename":"$basename"}' -H 'Content-Type: application/json' -X POST http://server:5011/apis/v1/VOD/save-VOD;

                #-c:v libx264 -b:v 2500k -g 30 -r 30 -s 1280x720 -preset fast -profile:v baseline /recordings/$basename.mp4

        }
        application hls {
            live on;
            hls on;
            hls_fragment_naming system;
            hls_fragment 5;
            hls_playlist_length 10;
            hls_path /opt/data/hls;
            hls_nested on;

            hls_variant _720p2628kbs BANDWIDTH=2628000,RESOLUTION=1280x720;
            hls_variant _480p1128kbs BANDWIDTH=1128000,RESOLUTION=854x480;
        }
    }
}

http {
    access_log /dev/stdout combined;

    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        listen 80;


        # Uncomment these lines to enable SSL.
        # Update the ssl paths with your own certificate and private key.
        # listen 443 ssl;
        # ssl_certificate     /opt/certs/example.com.crt;
        # ssl_certificate_key /opt/certs/example.com.key;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /opt/data;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }


        location /live {
    
          alias /opt/data/hls;
          types {
              application/vnd.apple.mpegurl m3u8;
              video/mp2t ts;
          }
          add_header Cache-Control no-cache;
          add_header Access-Control-Allow-Origin *;
        }
		

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet static/stat.xsl;
        }

        location /static {
            alias /www/static;
        }

        location = /crossdomain.xml {
            root /www/static;
            default_type text/xml;
            expires 24h;
        }
    }
}
