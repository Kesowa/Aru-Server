name: Build and Deploy

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: your-aws-account-id.dkr.ecr.your-region.amazonaws.com/your-repo-name:${{ github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: your-region

      - name: Create ECR Repository
        run: aws ecr create-repository --repository-name your-repo-name

      - name: Deploy to ECS Fargate
        uses: einaregilsson/ecs-deploy@v2
        with:
          region: your-region
          cluster: your-cluster-name
          service: your-service-name
          image: your-aws-account-id.dkr.ecr.your-region.amazonaws.com/your-repo-name:${{ github.sha }}
          wait-for-service-stability: true
